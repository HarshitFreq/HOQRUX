<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Hoqrux</title>

    <!-- PWA & Color Metadata -->
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Personal Media Radar, Film Tracker & Broadcast Airing Calendar" />

    <!-- Apple Web App & Home Screen Integration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hoqrux" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph Sharing Embeds -->
    <meta property="og:title" content="Hoqrux" />
    <meta property="og:description" content="Personal Media Radar, Film Tracker & Broadcast Airing Calendar" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <!-- React Native Web Recommended Reset & Desktop Frame -->
    <style id="expo-reset">
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #050507;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-touch-callout: none;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        flex: 1;
        background-color: #050507;
      }

      #root > div {
        display: flex;
        flex-direction: column;
        flex: 1;
        height: 100%;
        width: 100%;
      }

      /* Swiss Brutalist Desktop Centering Frame for Mouse / Laptop screens */
      @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
        #root {
          justify-content: center;
          align-items: center;
          background-color: #000000;
        }
        #root > div {
          max-width: 520px;
          width: 100%;
          height: 100%;
          margin: 0 auto;
          border-left: 1px solid #181820;
          border-right: 1px solid #181820;
          box-shadow: 0 0 100px rgba(0, 0, 0, 0.95);
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
