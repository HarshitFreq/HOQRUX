<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Hoqrux</title>

    <!-- PWA & Color Metadata -->
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Personal Media Radar, Film Tracker & Broadcast Airing Calendar" />

    <!-- Apple Web App & Standalone iOS Integration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hoqrux" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph Sharing Embeds -->
    <meta property="og:title" content="Hoqrux" />
    <meta property="og:description" content="Personal Media Radar, Film Tracker & Broadcast Airing Calendar" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <!-- React Native Web Recommended Reset & Desktop Frame -->
    <style id="expo-reset">
      :root {
        color-scheme: dark;
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        height: 100%;
        height: -webkit-fill-available;
        background-color: #050507 !important;
        color-scheme: dark;
      }

      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #050507 !important;
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #root {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: #050507 !important;
        color-scheme: dark;
      }

      #root > div {
        display: flex;
        flex-direction: column;
        flex: 1;
        height: 100%;
        width: 100%;
        max-width: 100% !important;
      }

      /* Desktop & PC Widescreen Enhancements */
      @media (min-width: 768px) {
        html, body, #root {
          background-color: #050507 !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
